version: "3.9"
services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg://atlaspure:atlaspure@db:5432/atlaspure

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: atlaspure
      POSTGRES_PASSWORD: atlaspure
      POSTGRES_DB: atlaspure
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlaspure -d atlaspure"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
